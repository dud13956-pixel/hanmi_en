const KNOWLEDGE = `
=== DOMAIN KNOWLEDGE: micro SAW & VISION PLACEMENT (MSVP) ===
(Use this to speak like a real expert. Facts marked [verify] come from public sources and may be outdated: never volunteer exact numbers from them; if the learner states a spec, accept it unless clearly impossible.)

WHAT MSVP IS
- An integrated back-end (packaging) system by Hanmi Semiconductor (Korea). "micro SAW" = package singulation saw that cuts strips/substrates into individual packages. "VISION PLACEMENT" (VP) = handler that cleans, dries, inspects (high-resolution 2D/3D vision), sorts (good/reject bins) and loads units into trays. Because of the process flow the two work as ONE system.
- Process flow: strip loading -> pre-cut vision alignment (fiducials/cut streets) -> sawing on a chuck table -> cleaning -> drying -> 2D/3D inspection -> sorting -> tray loading/offloading.
- Applications: BGA, QFN, MAP-type strips; memory (DRAM, NAND, HBM-related packages) and system semiconductors; large-area FC-BGA (flip-chip BGA) substrates for AI servers, where larger panels make warpage control and cutting precision more critical.
- Hanmi's Vision Placement: first generation 1998; No.1 global market share since 2004 (company claim, 20+ consecutive years).
- micro SAW was developed in-house and launched 2021 (before that the saw was sourced from a Japanese maker, which lengthened delivery). In-house saw shortened MSVP production lead time and removed supply risk.
- micro SAW lineup [verify]: P2101 dual-chuck saw (10-inch, two independent chuck tables & blades for simultaneous cutting); P1201 for jumbo PCB panels up to 500 x 500 mm; P1121 12-inch; T2101 tape type; GL2101 glass/lens/filter saw.
- Latest generation [verify]: "7th-generation micro SAW & VISION PLACEMENT 6.0 GRIFFIN" (2024): Blade Change Master (automatic blade replacement), Auto Kit Change, FSD (Full Self Device setup: insert strip and tray, the machine recognizes align marks and builds the recipe/report automatically; setup time reported as about 8 hours by a skilled engineer -> about 35 minutes).
- Distributor-listed P2101 features [verify]: active motion profiles, post-cutting alignment, intelligent pattern matching, auto jig teaching, auto blade dressing, water detection, smart vacuum pump, cutting simulator, 8 cutting channels.
- Warranty: in 2022 Hanmi announced a 2-year standard warranty on micro SAW [verify current policy].
- Showrooms/demo sites have been opened in Suzhou (China) and Zhongli (Taiwan) [verify].

GENERAL SAWING KNOW-HOW (industry-standard, safe to discuss)
- Blade: diamond blades (resin bond, nickel/electroformed bond, metal/sintered bond, hybrid); hub vs hubless; blade thickness determines kerf width; blade wear; dressing exposes fresh diamonds; broken-blade detection; blade height (Z) setup.
- Spindle speed (krpm), feed rate (mm/s), cut depth into tape/jig, cutting water/coolant flow, DI water, cleaning nozzles.
- Typical quality issues: top-side/back-side chipping, burrs (on metal leads, esp. QFN copper), slivers, delamination, die fly-off, kerf width variation, cut position shift, cracks, warpage-induced misalignment.
- Root-cause levers: wrong blade spec, worn/loaded blade (needs dressing), feed too fast, coolant nozzle misaligned, vacuum leak on chuck/jig, strip warpage, alignment recipe errors.
- Vision inspection: 2D (marking, package surface, chipping, foreign material, dimensions), 3D (ball height/coplanarity, warpage). Terms: overkill (false reject) vs underkill (escape), recipe/threshold tuning, golden sample, reject bin, tray mapping.
- Productivity terms: UPH (units per hour), cycle time, throughput, uptime/availability, MTBF, MTBA, MTTR, OEE, yield, CoO/TCO (cost of ownership), footprint, consumables (blades, filters), operator-free/unmanned operation, SECS/GEM host communication.

EQUIPMENT SALES PROCESS
- Lead generation (SEMICON shows, referrals) -> needs analysis -> demo/evaluation (sample cutting) -> RFQ -> quotation -> negotiation -> PO -> manufacturing -> FAT (factory acceptance test at maker's site) -> shipping -> installation & setup -> SAT (site acceptance test) -> warranty & CS (customer service) engineers, spare parts.
- Commercial terms: unit price, options, Incoterms (EXW, FOB, CIF, DAP), payment terms (T/T, L/C, e.g. 30% down payment / 70% before shipment), lead time, delivery schedule, warranty period, training, spare-parts kit, local service support.
- Typical customers: OSATs (outsourced assembly & test), IDMs (memory/logic makers' packaging lines), substrate makers (FC-BGA), module makers. Common regions: Taiwan, China, Malaysia (Penang), Vietnam, Philippines, Korea, US.
- Never invent prices, delivery dates or performance numbers on behalf of Hanmi. If the learner needs a number, they may say it; if you (as customer) need one, ask for it.
`;

/* ---------------------------- STATE ---------------------------- */
const DEFAULT_STATE = () => ({
  v:1,
  startDate: todayStr(),
  weekOverride: null,
  settings:{
    apiKey:'', model:'claude-haiku-5-5', tier:'default',
    ttsEngine:'auto', ttsRate:1.0, autoListen:true, autoSend:true,
    showCorrections:true, autoKo:false, weeklyGoal:5,
  },
  notebook:[],      // {id, original, corrected, explanation_ko, category, count, firstSeen, lastSeen, mastered}
  expressions:[],   // {en, ko, added}
  sessions:[],      // compact summaries
  done:{},          // scenarioId -> count
  usage:{},         // 'YYYY-MM' -> {in, out, usd}
});
let S = DEFAULT_STATE();
const RT = { screen:'home', tab:'home', call:null, report:null, caps:{}, uid:null, dbReady:false, toastT:null, nbTab:'mistakes' };
const LS_KEY = 'fabtalk.v1';
const LS_KEY_API = 'fabtalk.apikey';

function todayStr(d=new Date()){ const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function monthStr(d=new Date()){ return todayStr(d).slice(0,7); }
function daysBetween(a,b){ return Math.floor((new Date(b+'T00:00:00') - new Date(a+'T00:00:00'))/86400000); }
function currentWeek(){
  if (S.weekOverride) return S.weekOverride;
  const d = daysBetween(S.startDate, todayStr());
  return Math.min(12, Math.max(1, Math.floor(d/7)+1));
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function norm(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim(); }

/* ---------------------------- STORAGE ---------------------------- */
const Store = {
  saveT:null, saving:false, pending:false,
  lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } },
  loadLocal(){
    const raw = this.lsGet(LS_KEY);
    if (raw){ try{ S = migrate(JSON.parse(raw)); }catch(e){} }
    const key = this.lsGet(LS_KEY_API);
    if (key) S.settings.apiKey = key;
  },
  async load(){
    const fromLS = S;
    let fromDB = null;
    if (RT.caps.db && RT.uid){
      try{
        const snap = await withTimeout(RT.caps.db.doc(`data/users/${RT.uid}/state`).get(), 10000);
        if (snap && snap.exists){
          fromDB = JSON.parse(JSON.stringify(snap.data()));
          // sessions are kept in monthly docs
          const col = await withTimeout(RT.caps.db.collection(`data/users/${RT.uid}`).get(), 10000);
          const sessions = [];
          col.docs.forEach(d=>{ if (d.id.startsWith('sessions_')){ const b=d.data(); if (b && Array.isArray(b.items)) sessions.push(...b.items); } });
          fromDB.sessions = sessions.sort((a,b)=>a.ts-b.ts);
        }
        RT.dbReady = true;
      }catch(e){ console.warn('db load failed', e); RT.dbReady = false; }
    }
    // keep whichever copy is newer (device vs. Claude account)
    if (fromDB && (fromDB.updatedAt||0) >= (fromLS.updatedAt||0)){
      const key = S.settings.apiKey;
      S = migrate(fromDB); S.settings.apiKey = key;
    } else if (RT.dbReady && (fromLS.updatedAt||0) > 0){
      this.flushDB(); // device copy is newer: push it up
    }
  },
  save(){
    S.updatedAt = Date.now();
    this.lsSet(LS_KEY, JSON.stringify({...S, settings:{...S.settings, apiKey:''}}));
    this.lsSet(LS_KEY_API, S.settings.apiKey||'');
    if (RT.caps.db && RT.uid && RT.dbReady){
      clearTimeout(this.saveT);
      this.saveT = setTimeout(()=>this.flushDB(), 400);
    }
  },
  flushNow(){ if (this.saveT){ clearTimeout(this.saveT); this.saveT=null; this.flushDB(); } },
  async flushDB(){
    this.saveT = null;
    if (this.saving){ this.pending = true; return; }
    this.saving = true;
    try{
      const {sessions, ...rest} = S;
      const body = JSON.parse(JSON.stringify({...rest, settings:{...rest.settings, apiKey:''}}));
      await RT.caps.db.doc(`data/users/${RT.uid}/state`).set(body);
      const byMonth = {};
      sessions.forEach(s=>{ const m = s.date.slice(0,7); (byMonth[m] ||= []).push(s); });
      for (const m of Object.keys(byMonth)){
        const items = byMonth[m];
        const sig = items.length+':'+(items[items.length-1]?.id||'');
        if (this._sig?.[m] === sig) continue;
        await RT.caps.db.doc(`data/users/${RT.uid}/sessions_${m}`).set({items});
        (this._sig ||= {})[m] = sig;
      }
    }catch(e){ console.warn('db save failed', e); if (e && e.code==='quota_exceeded') toast('클라우드 저장 공간이 가득 찼어요. 기기에는 저장됩니다.'); }
    this.saving = false;
    if (this.pending){ this.pending = false; this.flushDB(); }
  },
};
function migrate(o){
  const base = DEFAULT_STATE();
  const out = {...base, ...o, settings:{...base.settings, ...(o.settings||{})}};
  ['notebook','expressions','sessions'].forEach(k=>{ if(!Array.isArray(out[k])) out[k]=[]; });
  if (typeof out.done!=='object'||!out.done) out.done={};
  if (typeof out.usage!=='object'||!out.usage) out.usage={};
  return out;
}
function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}), ms))]); }

/* ---------------------------- CAPABILITIES ---------------------------- */
async function initCaps(){
  const has = () => typeof window.claude === 'object' && window.claude && typeof window.claude.use === 'function';
  for (let i=0; i<4 && !has(); i++) await sleep(250);
  if (!has()) return;
  RT.inArtifact = true;
  const get = async n => { try{ return await withTimeout(window.claude.use(n), 10000); }catch(e){ return null; } };
  const [sample, dictation, tts, db, user] = await Promise.all(['sample','dictation','tts','db','user'].map(get));
  RT.caps = {sample, dictation, tts, db, user};
  RT.inArtifact = true;
  if (user && db){ try{ RT.uid = await user.id(); }catch(e){ RT.uid = null; } }
  if (dictation) wireDictation(dictation);
  if (tts && typeof tts.onState==='function'){ tts.onState(({state})=>{ RT.ttsState = state; }); }

const PRICES = { haiku:{in:0.10,out:0.50}, sonnet:{in:2,out:10}, opus:{in:4,out:20} }; // USD per 1M tokens (estimate, Oct 2026)
function priceFor(model){ const m = model.toLowerCase(); return m.includes('haiku')?PRICES.haiku:m.includes('opus')?PRICES.opus:PRICES.sonnet; }
function addUsage(u){
  if (!u) return;
  const p = priceFor(S.settings.model);
  const inTok = (u.input_tokens||0)+(u.cache_read_input_tokens||0)+(u.cache_creation_input_tokens||0);
  const outTok = u.output_tokens||0;
  const m = monthStr();
  const cur = S.usage[m] || {in:0,out:0,usd:0};
  cur.in += inTok; cur.out += outTok; cur.usd += (inTok*p.in + outTok*p.out)/1e6;
  S.usage[m] = cur;
}

class AIError extends Error { constructor(code, msg){ super(msg); this.code = code; } }

async function aiJSON({system, messages, schema, name, maxTokens=700, signal}){
  const mode = aiMode();
  if (mode === 'none') throw new AIError('no_key', 'AI 연결이 필요해요. 설정에서 API 키를 입력하세요.');
  if (mode === 'claude') return sampleJSON({system, messages, schema, signal});
  return apiJSON({system, messages, schema, name, maxTokens, signal});
}

async function apiJSON({system, messages, schema, name, maxTokens, signal}, attempt=0){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), 45000);
  if (signal) signal.addEventListener('abort', ()=>ctrl.abort(), {once:true});
  let res;
  try{
    res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST', signal: ctrl.signal,
      headers:{
        'content-type':'application/json',
        'x-api-key': S.settings.apiKey.trim(),
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true',
      },
      body: JSON.stringify({
        model: S.settings.model, max_tokens: maxTokens,
        system: [{type:'text', text: system, cache_control:{type:'ephemeral'}}],
        messages,
        tools:[{name, description:'Return your answer in this structure.', input_schema: schema}],
        tool_choice:{type:'tool', name},
      }),
    });
  }catch(e){
    clearTimeout(t);
    if (signal && signal.aborted) throw new AIError('aborted','취소됨');
    if (attempt < 1) { await sleep(1200); return apiJSON({system, messages, schema, name, maxTokens, signal}, attempt+1); }
    throw new AIError('network', '네트워크 연결을 확인해 주세요.');
  }
  clearTimeout(t);
  let body = null; try{ body = await res.json(); }catch(e){}
  if (!res.ok){
    const msg = body?.error?.message || '';
    if (res.status===401) throw new AIError('auth','API 키가 올바르지 않아요. 설정에서 다시 확인해 주세요.');
    if (res.status===403) throw new AIError('perm','이 API 키로는 사용할 수 없어요 (권한).');
    if (res.status===404) throw new AIError('model',`모델 이름(${S.settings.model})을 찾을 수 없어요. 설정에서 모델을 바꿔 보세요.`);
    if (res.status===400 && /credit/i.test(msg)) throw new AIError('credit','API 크레딧이 부족해요. Claude Console에서 충전해 주세요.');
    if ((res.status===429 || res.status===529 || res.status>=500) && attempt < 2){ await sleep(1500*(attempt+1)); return apiJSON({system, messages, schema, name, maxTokens, signal}, attempt+1); }
    if (res.status===429) throw new AIError('rate','요청이 너무 많아요. 잠시 후 다시 시도해 주세요.');
    throw new AIError('api', `AI 응답 오류 (${res.status}) ${msg.slice(0,120)}`);
  }
  addUsage(body.usage);
  const tu = (body.content||[]).find(c=>c.type==='tool_use');
  if (!tu) throw new AIError('format','AI 응답 형식이 올바르지 않아요. 다시 시도해 주세요.');
  return tu.input;
}

async function sampleJSON({system, messages, schema, signal}){
  const sample = RT.caps.sample;
  const instr = `${system}\n\n=== OUTPUT FORMAT ===\nRespond with ONLY one JSON object (no markdown, no prose) that matches this JSON Schema:\n${JSON.stringify(schema)}`;
  const input = messages.map((m,i)=> i===0 ? {role:'user', content: instr + '\n\n=== CONVERSATION START ===\n' + m.content} : m);
  const opts = {cache:false, modelTier: S.settings.tier==='quick'?'quick':'default'};
  if (signal) opts.signal = signal;
  try{
    if (typeof sample.json === 'function'){
      const v = await sample.json(input, opts);
      const obj = typeof v==='string' ? parseLooseJSON(v) : v;
      if (obj && typeof obj==='object') return obj;
    }
    const r = await sample(input, opts);
    const obj = parseLooseJSON(r && r.text);
    if (!obj) throw new AIError('format','AI 응답 형식이 올바르지 않아요.');
    return obj;
  }catch(e){
    if (e instanceof AIError) throw e;
    const c = e && e.code;
    if (c==='not_granted') throw new AIError('not_granted','Claude 사용 권한이 꺼져 있어요. 페이지를 다시 열어 허용해 주세요.');
    if (c==='rate_limited') throw new AIError('rate','Claude 사용량 한도에 도달했어요. 잠시 후 다시 시도해 주세요.');
    if (signal && signal.aborted) throw new AIError('aborted','취소됨');
    throw new AIError('sample', 'Claude 응답 오류: '+(e && e.message ? e.message : '알 수 없음'));
  }
}
function parseLooseJSON(t){
  if (!t) return null;
  try{ return JSON.parse(t); }catch(e){}
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} }
  return null;
}
const sleep = ms => new Promise(r=>setTimeout(r,ms));

function sanitizeTurn(o){
  const s = v => typeof v==='string' ? v.trim() : '';
  const out = {
    reply: s(o.reply), reply_ko: s(o.reply_ko),
    has_error: o.has_error===true, original: s(o.original), corrected: s(o.corrected),
    category: s(o.category)||'none', explanation_ko: s(o.explanation_ko),
    better: s(o.better), hint_en: s(o.hint_en), hint_ko: s(o.hint_ko), end_call: o.end_call===true,
  };
  if (!out.original || !out.corrected || norm(out.original)===norm(out.corrected)) out.has_error = false;
  if (out.better && norm(out.better)===norm(out.corrected)) out.better = '';
  if (!out.reply) throw new AIError('format','AI가 빈 응답을 보냈어요. 다시 시도해 주세요.');
  return out;
}

function buildSystem(sc){
  const week = sc.week || currentWeek();
  const ph = phaseOf(week);
  const wk = WEEKS[week-1];
  const p = sc.persona;
  let extra = '';
  if (sc.kind==='review'){
    extra = `\nREVIEW FOCUS: This is a review call. Naturally create situations where the learner must use these previously corrected expressions (don't tell them the list):\n${sc.reviewItems.map(x=>'- '+x.corrected+'  (they used to say: "'+x.original+'")').join('\n')}\nIf they now use the correct form, briefly praise it inside "better" is NOT needed; just continue.`;
  }
  return `You are a role-play partner AND a hidden English coach for a phone-English lesson.

LEARNER: A Korean domestic sales representative at Hanmi Semiconductor (a Korean semiconductor back-end equipment maker). Their products: micro SAW & VISION PLACEMENT (MSVP). They are intermediate (about CEFR B1) and want to handle overseas customers by phone confidently within 3 months. Their speech comes from speech recognition, so ignore missing punctuation/capitalization and obvious recognition glitches (e.g. "hammy" = "Hanmi", "micro saw", "vision placement", "you pH" = "UPH"); never correct those.

YOUR ROLE: ${p.name}, ${p.title} at a ${p.org}. You are knowledgeable about semiconductor packaging and sawing/inspection equipment and react like a real industry professional (ask sharp, realistic questions, use correct terminology).
SITUATION: ${sc.situation}
LEARNER'S GOAL (for you to evaluate, don't announce it): ${sc.goal_en}
WEEK ${week} THEME: ${wk ? wk.theme+' / grammar focus: '+wk.grammar : 'free practice'}
${PHASE_RULES[ph]}
${extra}

CONVERSATION RULES
- This is a PHONE CALL: speak naturally, one question or point at a time, no lists, no markdown, no emojis, no stage directions.
- Stay in character. Never mention you are an AI or a coach in "reply".
- Keep the conversation moving toward the goal; if the learner is stuck or silent, help naturally (rephrase, ask a simpler question).
- If the learner speaks Korean, reply in English in character and put a gentle English version of what they meant in "better".
- If the learner says "[END CALL]" or clearly wants to finish, close politely and set end_call=true.
- Do not invent Hanmi prices, delivery dates or spec numbers as facts. As the customer, ask for them.

CORRECTION RULES (fields has_error/original/corrected/explanation_ko/better)
- Only evaluate the learner's LAST utterance. For the very first turn (call connected) there is nothing to correct.
- Prefer real errors: tense, prepositions (by/until/on/at), articles, plurals, subject-verb agreement, word order, Konglish (e.g. "feedback to you" -> "get back to you", "I will check and revert" is fine), wrong collocations.
- "original" must be a short exact quote from the learner; "corrected" the minimal fix in context. explanation_ko: one friendly Korean sentence with the rule.
- Never mark correct sentences as errors. Don't correct style in "corrected" — use "better" for style/professional tone.

${KNOWLEDGE}`;
}

function buildReportPrompt(call){

    messages:[{role:'user', content:`Scenario: ${sc.title} (week ${sc.week||currentWeek()})\nGoal: ${sc.goal_en}\nCall length: ${fmtDur(call.duration)}\n\nLive corrections already shown to the learner:\n${live}\n\nTranscript:\n${lines}\n\nCreate the report.`}],

const SILENT_WAV = (()=>{ // 0.25 s of silence, 8 kHz mono 8-bit PCM
  const n=2000, b=new Uint8Array(44+n), w=(o,str)=>{ for(let i=0;i<str.length;i++) b[o+i]=str.charCodeAt(i); }, u32=(o,v)=>{ b[o]=v&255;b[o+1]=v>>8&255;b[o+2]=v>>16&255;b[o+3]=v>>24&255; };
  w(0,'RIFF'); u32(4,36+n); w(8,'WAVEfmt '); u32(16,16); b[20]=1; b[22]=1; u32(24,8000); u32(28,8000); b[32]=1; b[34]=8; w(36,'data'); u32(40,n); b.fill(128,44);
  let bin=''; b.forEach(x=>bin+=String.fromCharCode(x)); return 'data:audio/wav;base64,'+btoa(bin);
})();
const TTS = {
  voices:[], current:null, token:0,
  engine(){
    const pref = S.settings.ttsEngine;
    if (pref==='off') return null;
    if ((pref==='auto'||pref==='claude') && RT.caps.tts) return 'claude';
    if ('speechSynthesis' in window) return 'web';
    return null;
  },
  loadVoices(){ if (!('speechSynthesis' in window)) return; const v = speechSynthesis.getVoices(); if (v.length) this.voices = v; },
  pickVoice(){
    const v = this.voices.length ? this.voices : (('speechSynthesis' in window) ? speechSynthesis.getVoices() : []);
    const en = v.filter(x=>/^en[-_]/i.test(x.lang));
    const us = en.filter(x=>/en[-_]US/i.test(x.lang));
    return us.find(x=>/google/i.test(x.name)) || us.find(x=>/samantha|ava|allison|nicky|aaron/i.test(x.name) && !/compact|eloquence/i.test(x.name)) || us.find(x=>x.localService) || us[0] || en[0] || null;
  },
  rate(){
    const ph = phaseOf(RT.call?.scenario?.week || currentWeek());
    const base = ph===1?0.92:ph===2?1.0:1.06;
    return Math.min(1.5, Math.max(0.7, base*S.settings.ttsRate));
  },
  // Returns true if speech was heard to start, false if it failed (caller shows a "tap to hear" fallback).
  async speak(text, voice){
    const eng = this.engine();
    if (!eng || !text) return true;
    this.stop();
    const my = ++this.token;
    if (eng==='claude' && !this.claudeBroken){
      for (let attempt=0; attempt<3; attempt++){
        try{ await RT.caps.tts.speak(text, {voice: voice||'buttery', rate:this.rate(), language:'en'}); return true; }
        catch(e){
          const code = e && e.code;
          if (my !== this.token || code==='viewer_stopped') return true; // stopped on purpose
          if (code==='busy' || code==='rate_limited'){ await sleep(700*(attempt+1)); if (my !== this.token) return true; continue; }
          if (code==='not_granted'){ S.settings.ttsEngine='web'; Store.save(); }
          this.claudeBroken = true; break; // fall back to the device voice below
        }
      }
      if (my !== this.token) return true;
      if (!('speechSynthesis' in window)) return false;
    }
    return this.speakWeb(text, my);
  },
  async speakWeb(text, my){
    if (!('speechSynthesis' in window)) return false;
    try{ speechSynthesis.resume(); }catch(e){} // un-stick a paused queue (Safari/Chrome quirk)
    // Web Speech: split into sentences to avoid Android's long-utterance cutoff
    const parts = text.match(/[^.!?]+[.!?]*\s*/g) || [text];
    const v = this.pickVoice();
    if (IS_IOS) await sleep(60);
    let heard = false;
    for (let i=0;i<parts.length;i++){
      const part = parts[i];
      if (my !== this.token) return true;
      const ok = await new Promise(res=>{
        const u = new SpeechSynthesisUtterance(part.trim());
        u.lang = 'en-US'; if (v) u.voice = v; u.rate = this.rate(); u.volume = 1;
        let started = false, done = false;
        const fin = r=>{ if(!done){ done=true; res(r); } };
        u.onstart = ()=>{ started = true; };
        u.onend = ()=>fin(true);
        u.onerror = ev=>fin(!!started && ev && ev.error==='interrupted');
        // watchdog: if nothing starts in 2.5s the engine is blocked (silent mode, audio session, no gesture)
        setTimeout(()=>{ if (!started && !speechSynthesis.speaking){ try{ speechSynthesis.cancel(); }catch(_){} fin(false); } }, 2500);
        setTimeout(()=>fin(true), 4000 + part.length*120); // safety for engines that never fire onend
        try{ speechSynthesis.speak(u); }catch(_){ fin(false); }
      });
      if (!ok && !heard) return false;
      heard = heard || ok;
    }
    return true;
  },
  // Call from a tap: plays a silent clip so iOS opens its audio session for playback, and wakes speechSynthesis.
  prime(){
    try{
      if (!this._a){ this._a = new Audio(SILENT_WAV); this._a.setAttribute('playsinline',''); }
      const p = this._a.play(); if (p && p.catch) p.catch(()=>{});
    }catch(e){}
    try{ if ('speechSynthesis' in window && this.engine()!=='claude'){ speechSynthesis.resume(); const u=new SpeechSynthesisUtterance(' '); u.volume=0; speechSynthesis.speak(u); } }catch(e){}
  },
  stop(){
    this.token++;
    try{ if (RT.caps.tts) RT.caps.tts.stop(); }catch(e){}
    // iOS ignores a speak() issued right after an unnecessary cancel(); only cancel when something is queued
    try{ if ('speechSynthesis' in window && (speechSynthesis.speaking || speechSynthesis.pending)) speechSynthesis.cancel(); }catch(e){}
  },
};

function dictationTip(){

const STT = {
  active:false, finals:[], partial:'', rec:null, denied:false, onUpdate:null, onDone:null,
  kind(){ if (RT.caps.dictation) return 'claude'; return micBlockReason() ? null : 'web'; },
  // rebuild the transcript from all results each event (handles Android and iOS Safari duplicate/cumulative quirks)
  rebuild(results){
    const parts = [];
    for (let i=0;i<results.length;i++){
      const t = (results[i][0] && results[i][0].transcript || '').trim(); if (!t) continue;
      const last = parts[parts.length-1];
      if (last && norm(t).startsWith(norm(last))) parts[parts.length-1] = t;
      else if (last && norm(last).startsWith(norm(t))) {}
      else parts.push(t);
    }

  },
  text(){ return (this.finals.join(' ')+' '+this.partial).replace(/\s+/g,' ').trim(); },
  addFinal(t){

    else if (last && norm(last).startsWith(norm(t))) {/* duplicate */}

  },

    this.finals=[]; this.partial=''; this.onUpdate=onUpdate; this.onDone=onDone;

    if (k==='claude'){
      this.active = true;
      RT.caps.dictation.start().catch(e=>{
        this.active=false;
        if (e && e.code==='not_granted'){ toast('마이크 사용이 거부되어 키보드 입력으로 전환해요.'); RT.caps.dictation=null; }
        this.finish(true);
      });
      return true;
    }
    if (k==='web'){
      const rec = new SR();
      rec.lang='en-US'; rec.continuous=!IS_IOS; // iOS Safari is more stable with single-utterance mode rec.interimResults=true; rec.maxAlternatives=1;
      const auto = !!(RT.call && RT.call.autoStarted);
      rec.onresult = ev=>{ this.rebuild(ev.results); this.onUpdate && this.onUpdate(this.text()); };
      rec.onerror = ev=>{
        if (ev.error==='not-allowed' || ev.error==='service-not-allowed'){
          if (auto) return; // auto-start without a tap can be refused; not a real denial
          this.denied=true;
          if (IS_IOS && ev.error==='service-not-allowed') toast('아이폰 설정 > Siri에서 Siri를 켜야 음성 인식이 돼요. 지금은 키보드로 입력하세요.', 5000);
          else toast(IS_IOS ? '마이크 권한이 없어요. 설정 > Safari > 마이크에서 허용하거나 키보드로 입력하세요.' : '마이크 권한이 없어요. 브라우저 설정에서 허용하거나 키보드로 입력하세요.', 5000);
        }
        else if (ev.error==='network'){ toast('음성 인식에 인터넷 연결이 필요해요.'); }
        else if (ev.error==='audio-capture'){ toast('마이크를 찾을 수 없어요. 다른 앱이 마이크를 쓰고 있는지 확인하세요.'); }
      };
      rec.onend = ()=>{ if (this.rec===rec){ this.rec=null; this.finish(); } };
      try{ rec.start(); this.rec=rec; this.active=true; return true; }
      catch(e){ this.active=false; return false; }
    }
    return false;
  },
  stop(){
    if (!this.active) return;
    if (RT.caps.dictation && this.kind()==='claude'){ RT.caps.dictation.stop().catch(()=>{}); return; }
    if (this.rec){
      const rec = this.rec;
      try{ rec.stop(); }catch(e){ this.rec=null; this.finish(); return; }
      // Safari sometimes never fires onend after stop(): finish anyway
      setTimeout(()=>{ if (this.rec===rec){ this.rec=null; try{ rec.abort(); }catch(_){} this.finish(); } }, 1500);
    }
  },
  abort(){
    this.onDone = null;
    if (this.rec){ try{ this.rec.abort(); }catch(e){} this.rec=null; }
    if (RT.caps.dictation && this.active){ RT.caps.dictation.stop().catch(()=>{}); }
    this.active=false;
  },
  finish(silent){
    if (!this.active && !silent && !this.onDone) return;
    this.active=false;
    const t = this.text(); this.partial='';
    const cb = this.onDone; this.onDone=null;
    cb && cb(silent ? '' : t);
  },
};
function wireDictation(d){
  d.onPartial(({text})=>{ STT.partial = text||''; STT.onUpdate && STT.onUpdate(STT.text()); });
  d.onFinal(({text})=>{ STT.addFinal(text); STT.partial=''; STT.onUpdate && STT.onUpdate(STT.text()); });
  d.onState(({state})=>{ if (state==='idle' && STT.active) STT.finish(); });
}

function fmtDur(sec){ sec=Math.max(0,Math.round(sec||0)); return Math.floor(sec/60)+'분 '+String(sec%60).padStart(2,'0')+'초'; }
function fmtClock(sec){ sec=Math.max(0,Math.floor(sec)); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }
function weekSessions(){ const now=todayStr(); return S.sessions.filter(s=>daysBetween(s.date, now) < 7 && daysBetween(s.date, now) >= 0); }
function streak(){
  const days = new Set(S.sessions.map(s=>s.date)); let n=0; let d=new Date();
  if (!days.has(todayStr(d))) d.setDate(d.getDate()-1);
  while (days.has(todayStr(d))){ n++; d.setDate(d.getDate()-1); }
  return n;
}

  ${!STT.kind() && !c.tipHidden ? `<div class="hintbox" style="border-style:solid;font-size:12px">${dictationTip()} <button class="mini" data-act="hidetip" style="margin-left:4px">닫기</button></div>`:''}`:''}
  <div class="controls">
    <button class="cbtn" data-act="kbd" aria-label="키보드 입력 ${c.kbd?'끄기':'켜기'}" aria-pressed="${!!c.kbd}" ${!STT.kind()?'disabled':''}>${svg('kbd',22)}</button>

    <button class="mic ${st==='listening'?'on':''}" id="micbtn" data-act="mic" aria-label="${!STT.kind()?'키보드 열기 (키보드 마이크로 받아쓰기)':st==='listening'?'말하기 끝내고 전송':'말하기 시작'}" ${(st==='thinking'||st==='ended')?'disabled':''}>${svg(st==='listening'?'stop':'mic',30,2)}</button>
    <button class="cbtn" data-act="replay" aria-label="마지막 말 다시 듣기" ${!c.log.some(m=>m.role==='ai')?'disabled':''}>${svg('vol',22)}</button>

function logItem(m,i){
  if (m.role==='ai'){
    const showKo = S.settings.autoKo || m.showKo;
    return `<div class="bub ai">${esc(m.text)}${showKo&&m.ko?`<span class="ko">${esc(m.ko)}</span>`:''}
      <div class="bub-tools"><button class="mini" data-act="ko" data-i="${i}">${showKo?'번역 숨기기':'한글 번역'}</button><button class="mini" data-act="say" data-text="${esc(m.text)}">다시 듣기</button></div></div>`;
  }
  let h = `<div class="bub me">${esc(m.text)}</div>`;
  if (S.settings.showCorrections){
    if (m.corr) h += `<div class="corr"><span class="lab" style="color:var(--wrong-d)">교정 · ${esc(catKo(m.corr.category))}</span><p class="wrong">${esc(m.corr.original)}</p><p class="right">${esc(m.corr.corrected)}</p>${m.corr.explanation_ko?`<p class="why">${esc(m.corr.explanation_ko)}</p>`:''}</div>`;
    if (m.better) h += `<div class="corr" style="border-style:dashed"><span class="lab" style="color:var(--right-d)">더 자연스럽게</span><p class="right" style="font-size:14px">${esc(m.better)}</p></div>`;
  }
  return h;
}
function afterCallRender(){

    ${[...live, ...(rep?.extra_corrections||[])].map(c=>`<div class="citem"><p class="wrong">${esc(c.original)}</p><p class="right">${esc(c.corrected)}</p><p class="why">${esc(c.explanation_ko)}</p></div>`).join('')}</section>`
    : (!r.loading?`<div class="alert ok">이번 통화에서는 교정할 문장이 없었어요!</div>`:'')}
  ${rep?.key_expressions?.length?`<section class="col" style="gap:10px"><h2>오늘의 반도체 영업 표현</h2><div class="card dark" style="padding:4px 16px">${rep.key_expressions.map(e=>`<div class="exp"><div><p style="font-weight:600">${esc(e.en)}</p><p class="small" style="color:#CBD5E1;margin-top:3px">${esc(e.ko)}</p></div><button class="mini" data-act="say" data-text="${esc(e.en)}" aria-label="듣기">${svg('vol',14)}</button></div>`).join('')}</div>
    <button class="btn ghost block" data-act="saveexpr" ${r.exprSaved?'disabled':''}>${r.exprSaved?'표현집에 저장했어요':'표현집에 저장'}</button></section>`:''}
  ${rep?.next_focus_ko?`<div class="alert info"><b>다음 연습 포인트</b><br>${esc(rep.next_focus_ko)}</div>`:''}
  <button class="btn primary big block" data-act="again">같은 상황 다시 통화하기</button>
  <button class="btn ghost block" data-act="tab" data-tab="home">홈으로</button>
  </main>`;
}

/* ---------------------------- CALL LOGIC ---------------------------- */
function startCall(sc){
  TTS.stop(); STT.abort();
  RT.call = { scenario:sc, log:[], messages:[], startedAt:Date.now(), state:'thinking', kbd:!STT.kind(), lastHint:null, showHint:false, error:null, draft:'', ctrl:null, ended:false };
  RT.screen='call'; render();
  aiTurn('[CALL CONNECTED] The phone rings and the learner answers or you answer. Start the call in character with a natural opening line.');
}
function trimmedMessages(msgs){
  // keep first user msg, drop oldest (assistant,user) pairs beyond 28 messages
  if (msgs.length<=28) return msgs;
  const out = [msgs[0]]; const rest = msgs.slice(1); const drop = rest.length - 27; const d = drop + (drop%2);
  return out.concat(rest.slice(d));
}
async function aiTurn(userText, opts={}){
  const c = RT.call; if (!c || c.ended) return;
  if (!opts.retry){
    const last = c.messages[c.messages.length-1];
    if (last && last.role==='user') last.content += '\n' + userText; // previous turn failed: merge to keep roles alternating
    else c.messages.push({role:'user', content:userText});
  }
  c.state='thinking'; c.error=null; c.showHint=false; render();
  c.ctrl = new AbortController();
  try{
    const raw = await aiJSON({system: buildSystem(c.scenario), messages: trimmedMessages(c.messages), schema:TURN_SCHEMA, name:'phone_turn', maxTokens:700, signal:c.ctrl.signal});
    if (RT.call!==c || c.ended) return;
    const t = sanitizeTurn(raw);
    // attach correction to last learner line
    const lastMe = [...c.log].reverse().find(m=>m.role==='me');
    if (lastMe && c.messages.length>1){
      if (t.has_error){ lastMe.corr = {original:t.original, corrected:t.corrected, category:t.category, explanation_ko:t.explanation_ko}; addMistake(lastMe.corr); }
      if (t.better) lastMe.better = t.better;
    }
    c.messages.push({role:'assistant', content:t.reply});
    c.log.push({role:'ai', text:t.reply, ko:t.reply_ko});
    c.lastHint = t.hint_en ? {en:t.hint_en, ko:t.hint_ko} : null;
    c.state='speaking'; render(); Store.save();
    const heard = await TTS.speak(t.reply, c.scenario.persona.voice);
    if (RT.call!==c || c.ended) return;
    if (c.audioIssue !== !heard){ c.audioIssue = !heard; }
    if (t.end_call){ endCall(); return; }
    if (c.state==='speaking'){ c.state='idle'; render(); maybeAutoListen(); }
  }catch(e){
    if (RT.call!==c || c.ended || e.code==='aborted') return;
    c.state='idle'; c.error = e.message || '오류가 발생했어요.'; c.retryable=true; render();
  }
}
function maybeAutoListen(){
  const c = RT.call;
  // Web Speech can start without a fresh tap once permission is granted; Claude dictation needs a tap.
  if (c && c.state==='idle' && !c.kbd && S.settings.autoListen && STT.kind()==='web' && !IS_IOS) startListening(true);
}
function startListening(auto=false){
  const c = RT.call; if (!c) return;
  TTS.stop();
  c.autoStarted = auto;
  const ok = STT.start(t=>setLive(t), text=>onHeard(text));
  if (ok){ c.state='listening'; c.draft=''; render(); setLive(''); }
  else if (!auto){ c.kbd = true; render(); toast('음성 인식을 시작할 수 없어 키보드로 전환했어요.'); }
}
function onHeard(text){
  const c = RT.call; if (!c || c.ended) return;
  setLive('');
  text = (text||'').trim();
  if (!text){
    c.state='idle';
    if (STT.denied) c.kbd=true;
    render();
    if (!STT.denied && !c.autoStarted) toast('잘 안 들렸어요. 다시 말해 주세요.');
    return;
  }
  if (!S.settings.autoSend){ c.state='review'; c.draft=text; render(); return; }
  sendUser(text);
}
function sendUser(text){
  const c = RT.call; if (!c || c.ended) return;
  text = text.trim().slice(0,800); if (!text) return;
  c.draft=''; c.log.push({role:'me', text});
  aiTurn(text);
}
function endCall(){
  const c = RT.call; if (!c || c.ended) return;
  c.ended = true; c.state='ended';
  try{ c.ctrl && c.ctrl.abort(); }catch(e){}
  STT.abort(); TTS.stop(); clearInterval(RT.timerI);
  c.duration = (Date.now()-c.startedAt)/1000;
  const meTurns = c.log.filter(m=>m.role==='me').length;
  if (meTurns < 2){
    RT.call = null; toast('대화가 너무 짧아 기록하지 않았어요.'); go('home'); return;
  }
  const sc = c.scenario;
  const session = { id:uid(), ts:Date.now(), date:todayStr(), week: sc.week||currentWeek(), scenarioId: sc.id, title: sc.title, duration: Math.round(c.duration), turns: meTurns, scores:null, cefr:'', summary:'' };
  S.done[sc.id] = (S.done[sc.id]||0)+1;
  S.sessions.push(session);
  if (S.sessions.length > 400) S.sessions = S.sessions.slice(-400);
  Store.save();
  RT.report = { session, data:null, loading:true, error:null, liveCorr: c.log.filter(m=>m.corr).map(m=>m.corr), call:c, exprSaved:false };
  RT.lastScenario = sc;
  RT.call = null; RT.screen='report'; render();
  runReport();
}
async function runReport(){
  const r = RT.report; r.loading=true; r.error=null; render();
  try{
    const {system, messages} = buildReportPrompt(r.call);
    const raw = await aiJSON({system, messages, schema:REPORT_SCHEMA, name:'call_report', maxTokens:1800});
    const clamp = v => Math.max(0, Math.min(100, Math.round(Number(v)||0)));
    const d = {
      grammar:clamp(raw.grammar), vocabulary:clamp(raw.vocabulary), fluency:clamp(raw.fluency), task:clamp(raw.task),
      cefr: String(raw.cefr||'').slice(0,6), summary_ko:String(raw.summary_ko||''),
      strengths_ko: arr(raw.strengths_ko).slice(0,3).map(String), improve_ko: arr(raw.improve_ko).slice(0,3).map(String),
      extra_corrections: arr(raw.extra_corrections).filter(x=>x&&x.original&&x.corrected&&norm(x.original)!==norm(x.corrected)).slice(0,5),
      key_expressions: arr(raw.key_expressions).filter(x=>x&&x.en).slice(0,5),
      next_focus_ko: String(raw.next_focus_ko||''),
    };
    // de-dupe extra corrections against live ones
    const seen = new Set(r.liveCorr.map(c=>norm(c.corrected)));
    d.extra_corrections = d.extra_corrections.filter(x=>!seen.has(norm(x.corrected)));
    d.extra_corrections.forEach(x=>addMistake({...x, category:'grammar'}));
    r.data = d; r.loading=false;
    const s = S.sessions.find(x=>x.id===r.session.id);
    if (s){ s.scores={grammar:d.grammar,vocabulary:d.vocabulary,fluency:d.fluency,task:d.task}; s.cefr=d.cefr; s.summary=d.summary_ko; }
    Store.save();
  }catch(e){ r.loading=false; r.error = (e && e.message) || '리포트를 만들지 못했어요.'; }
  if (RT.report===r && RT.screen==='report') render();
}
function arr(v){ return Array.isArray(v)?v:[]; }
function addMistake(c){
  const key = norm(c.corrected);
  if (!key) return;
  const ex = S.notebook.find(n=>norm(n.corrected)===key || norm(n.original)===norm(c.original));
  if (ex){ ex.count++; ex.lastSeen=Date.now(); ex.mastered=false; return; }
  S.notebook.push({id:uid(), original:c.original, corrected:c.corrected, explanation_ko:c.explanation_ko||'', category:c.category||'grammar', count:1, firstSeen:Date.now(), lastSeen:Date.now(), mastered:false});
  if (S.notebook.length>500){ S.notebook.sort((a,b)=>(b.mastered?0:1)-(a.mastered?0:1)||b.lastSeen-a.lastSeen); S.notebook = S.notebook.slice(0,500); }
}

/* ---------------------------- EVENTS ---------------------------- */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  const c = RT.call;
  switch(act){
    case 'tab': if (RT.call && !RT.call.ended){ endCall(); return; } go(el.dataset.tab); break;
    case 'brief': { const sc = scenarioById(el.dataset.id); if(!sc) return; RT.brief = sc; go('brief'); break; }
    case 'startcall': {
      const sc = {...RT.brief};
      if (sc.kind==='free'){
        const sit = (document.getElementById('free-sit')?.value||'').trim();
        const role = (document.getElementById('free-role')?.value||'').trim();
        if (sit.length<5){ toast('연습할 통화 상황을 적어 주세요.'); return; }
        sc.situation = 'The learner described the call they want to practice (in Korean or English): "'+sit.slice(0,600)+'". Play the other party realistically.';
        sc.goal_en = 'Handle this call successfully: '+sit.slice(0,300); sc.goal_ko = sit.slice(0,120);
        RT.brief.freeSit = sc.freeSit = sit; RT.brief.freeRole = sc.freeRole = role;
        if (role) sc.persona = {...sc.persona, title: role.slice(0,80), org:'(as described by the learner)'};
      }
      // unlock audio inside the user gesture
      TTS.prime();
      startCall(sc); break;
    }
    case 'mic': {
      if (!c) return;
      if (!STT.kind()){ const m=document.getElementById('msg'); if (m){ TTS.stop(); m.focus(); } return; } // open keyboard for OS dictation
      if (c.state==='listening'){ STT.stop(); return; }
      if (c.state==='thinking'||c.state==='ended') return;
      startListening(); break;
    }
    case 'kbd': if (!c) return; c.kbd=!c.kbd; if (c.state==='listening'){ STT.abort(); c.state='idle'; } render(); break;
    case 'hidetip': if (c){ c.tipHidden=true; render(); } break;
    case 'hidehelp': RT.helpHidden=true; Store.lsSet('fabtalk.help','1'); render(); break;
    case 'hint': if (!c) return; c.showHint=!c.showHint; render(); break;
    case 'replay': { if (!c) return; const last=[...c.log].reverse().find(m=>m.role==='ai'); if (last){ STT.abort(); if(c.state==='listening') c.state='idle'; TTS.prime(); render(); TTS.speak(last.text, c.scenario.persona.voice).then(ok=>{ if (RT.call===c){ const was=c.audioIssue; c.audioIssue=!ok; if (was!==c.audioIssue) render(); if(!ok) toast(IS_IOS?'여전히 소리가 안 나면 무음 모드를 끄고 Safari를 새로고침해 보세요.':'여전히 소리가 안 나면 볼륨과 블루투스 연결을 확인하세요.',5000); } }); } break; }
    case 'soundtest': { TTS.prime(); toast('소리 테스트 중…'); TTS.speak('Hello! This is a sound test. Can you hear me clearly?', 'buttery').then(ok=>toast(ok?'소리가 들렸다면 정상이에요. 안 들리면 '+(IS_IOS?'무음 모드와 볼륨을 확인하세요.':'볼륨을 확인하세요.'):'음성 출력이 막혀 있어요. '+(IS_IOS?'무음 모드를 끄고 볼륨을 올린 뒤 다시 눌러 보세요.':'볼륨과 블루투스를 확인하세요.'), 5000)); break; }
    case 'ko': { if (!c) return; const m=c.log[+el.dataset.i]; if (m){ m.showKo=!m.showKo; render(); } break; }
    case 'say': TTS.prime(); TTS.speak(el.dataset.text, (RT.call&&RT.call.scenario.persona.voice)||'buttery'); break;
    case 'endcall': if (c){ if (c.log.filter(m=>m.role==='me').length>=2) endCall(); else ask('아직 대화가 짧아요. 통화를 끝낼까요? (기록되지 않아요)', '끝내기').then(ok=>{ if(ok && RT.call===c) endCall(); }); } break;
    case 'retry': if (c){ c.error=null; aiTurn(null, {retry:true}); } break;
    case 'togglecorr': S.settings.showCorrections = el.checked; Store.save(); render(); break;
    case 'retryreport': runReport(); break;
    case 'again': if (RT.lastScenario){ RT.brief = RT.lastScenario.kind==='review' ? scenarioById('review') : RT.lastScenario; go('brief'); } break;
    case 'saveexpr': {
      const r = RT.report; if (!r?.data) return;
      r.data.key_expressions.forEach(x=>{ if (!S.expressions.some(y=>norm(y.en)===norm(x.en))) S.expressions.push({en:x.en, ko:x.ko||'', added:Date.now()}); });
      if (S.expressions.length>600) S.expressions = S.expressions.slice(-600);
      r.exprSaved = true; Store.save(); render(); toast('표현집에 저장했어요.'); break;
    }
    case 'nbtab': RT.nbTab = el.dataset.t; render(); break;
    case 'master': { const n=S.notebook.find(x=>x.id===el.dataset.id); if(n){ n.mastered=!n.mastered; Store.save(); render(); } break; }
    case 'setweek': { const w=+el.dataset.w; S.weekOverride = w; Store.save(); toast(w+'주차로 변경했어요.'); go('home'); break; }
    case 'autoweek': S.weekOverride=null; Store.save(); render(); break;
    case 'testapi': testApi(); break;
    case 'export': { const ta=document.getElementById('backup'); ta.hidden=false; ta.value=JSON.stringify({...S, settings:{...S.settings, apiKey:''}}); ta.select(); try{ navigator.clipboard.writeText(ta.value).then(()=>toast('백업 데이터를 복사했어요. 메모장 등에 보관하세요.')); }catch(_){ toast('표시된 텍스트를 길게 눌러 복사하세요.'); } break; }
    case 'import': { const ta=document.getElementById('backup'); if (ta.hidden){ ta.hidden=false; ta.value=''; ta.focus(); toast('백업 텍스트를 붙여넣고 다시 누르세요.'); return; } try{ const o=JSON.parse(ta.value); if(!o||!Array.isArray(o.sessions)) throw 0; const key=S.settings.apiKey; S=migrate(o); S.settings.apiKey=key; Store.save(); toast('복원했어요.'); render(); }catch(_){ toast('백업 형식이 올바르지 않아요.'); } break; }
    case 'reset': ask('모든 학습 기록을 지울까요? 되돌릴 수 없어요.', '초기화').then(ok=>{ if(!ok) return; const key=S.settings.apiKey; S=DEFAULT_STATE(); S.settings.apiKey=key; Store.save(); toast('초기화했어요.'); go('home'); }); break;
    case 'dlg-ok': case 'dlg-cancel': closeAsk(act==='dlg-ok'); break;
  }
});
/* in-page confirm dialog (browser confirm() is blocked inside artifacts) */
let askResolve = null;
function ask(msg, okLabel='확인'){
  closeAsk(false);
  const d = document.createElement('div');
  d.id='dlg'; d.className='dlg-back';
  d.innerHTML = `<div class="dlg" role="alertdialog" aria-modal="true" aria-labelledby="dlg-msg"><p id="dlg-msg">${esc(msg)}</p><div class="row" style="justify-content:flex-end;gap:8px;margin-top:16px"><button class="btn ghost" data-act="dlg-cancel">취소</button><button class="btn primary" data-act="dlg-ok">${esc(okLabel)}</button></div></div>`;
  document.body.appendChild(d);
  d.querySelector('[data-act=dlg-ok]').focus();
  return new Promise(r=>{ askResolve = r; });
}
function closeAsk(v){ const d=document.getElementById('dlg'); if(d) d.remove(); if(askResolve){ const r=askResolve; askResolve=null; r(v); } }
document.addEventListener('submit', e=>{
  const f = e.target.closest('[data-act="sendform"]'); if (!f) return;
  e.preventDefault();
  const c = RT.call; if (!c || c.state==='thinking') return;
  const v = document.getElementById('msg').value.trim(); if (!v) return;
  if (c.state==='listening') STT.abort();
  TTS.prime();
  sendUser(v);
});
document.addEventListener('input', e=>{
  const el = e.target;
  if (el.id==='msg' && RT.call) RT.call.draft = el.value;
  if (el.dataset.set==='ttsRate'){ const v=document.getElementById('ratev'); if(v) v.textContent=Math.round(el.value*100)+'%'; }
});
document.addEventListener('change', e=>{
  const el = e.target; const k = el.dataset.set; if (!k) return;
  let v = el.type==='checkbox' ? el.checked : el.value;
  if (k==='ttsRate') v = parseFloat(v);
  if (k==='weeklyGoal') v = parseInt(v,10);
  if (k==='startDate'){ if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return; S.startDate=v; S.weekOverride=null; Store.save(); toast('시작일을 바꿨어요. 현재 '+currentWeek()+'주차예요.'); return; }
  if (k==='apiKey') v = String(v).trim();
  S.settings[k] = v; Store.save();
  if (k==='ttsEngine'||k==='model') render();
});
document.addEventListener('visibilitychange', ()=>{
  if (!document.hidden) return;
  if (RT.call && RT.call.state==='listening') STT.stop();
  Store.flushNow();
});
window.addEventListener('pagehide', ()=>Store.flushNow());

async function testApi(){
  if (!S.settings.apiKey){ toast('API 키를 먼저 입력하세요.'); return; }
  toast('연결 확인 중…', 8000);
  try{
    const r = await apiJSON({system:'Reply briefly.', messages:[{role:'user', content:'Say OK.'}], schema:{type:'object', properties:{ok:{type:'string'}}, required:['ok']}, name:'ping', maxTokens:50});
    Store.save(); toast('연결 성공! 통화를 시작할 수 있어요.'); render();
  }catch(e){ toast(e.message||'연결 실패', 5000); }
}

/* ---------------------------- BOOT ---------------------------- */
(async function boot(){
  RT.booting = true;
  Store.loadLocal();
  render(); // render immediately with this device's data
  await initCaps();
  await Store.load();
  if (!S.startDate) S.startDate = todayStr();
  RT.booting = false;
  render();
  if ('serviceWorker' in navigator && location.protocol==='https:' && !RT.caps.sample){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();
</script>
